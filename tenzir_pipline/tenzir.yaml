tenzir:
  # Debug logging configuration
  console-verbosity: "debug"
  log-file: "/var/log/tenzir/tenzir.log"
  log-queue-size: 10000
  
  pipelines:
    map-conn-to-ocsf:
      name: conn.log to OCSF Network Activity
      definition: |
        // The ground truth for connection state mapping is here:
        // https://github.com/zeek/zeek/blob/6671e95c6b07dfd59a12ec5507a5c3eb91f163ef/scripts/base/protocols/conn/main.zeek#L184
        let $conn_states = {
          // S0 means only a SYN seen and S1 the full handshake.
          S0: 1,
          S1: 1,
          // Only SF means Close.
          SF: 2,
          // The RST* states imply connection reset.
          RSTO: 3,
          RSTOH: 3,
          RSTOS0: 3,
          RSTR: 3,
          RSTRH: 3,
          // SH, SHR, S2, and S3 correspond to one-sided closure, which we
          // treat as Fail to be able to differentiate in analytics.
          S2: 4,
          S3: 4,
          SH: 4,
          SHR: 4,
          // Only REJ is rejection at the beginning of the connection.
          REJ: 5,
          // Connections Zeek couldn't classify.
          OTH: 6,
        }
        let $activity_names = [
          "Unknown",
          "Open",
          "Close",
          "Reset",
          "Fail",
          "Refuse",
          "Traffic",
          "Listen",
          "Other",
        ]
        let $proto_nums = {
          tcp: 6,
          udp: 17,
          icmp: 1,
          icmpv6: 58,
          ipv6: 41,
        }
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/conn.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        this = { zeek: this }
        // === Classification ===
        ocsf.activity_id = $conn_states[zeek.conn_state]? else 6
        ocsf.activity_name = $activity_names[ocsf.activity_id]? else "Other"
        ocsf.category_uid = 4
        ocsf.category_name = "Network Activity"
        ocsf.class_uid = 4001
        ocsf.class_name = "Network Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        move ocsf.time = zeek.ts
        ocsf.duration = int(move zeek.duration?)
        if ocsf.duration != null {
          // Convert duration to seconds and add to time
          ocsf.end_time = ocsf.time + duration(string(ocsf.duration) + "s")
        }
        ocsf.start_time = ocsf.time
        // === Context ===
        ocsf.metadata = {
          log_name: "conn.log",
          logged_time: move zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          uid: move zeek.uid,
          version: "1.4.0",
        }
        move ocsf.app_name = zeek.service?
        // === Primary ===
        ocsf.src_endpoint = {
          ip: zeek.id.orig_h,
          port: int(zeek.id.orig_p),
          mac: move zeek.orig_l2_addr?,
          location: {
            country: move zeek.orig_cc?,
          }
        }
        ocsf.dst_endpoint = {
          ip: zeek.id.resp_h,
          port: int(zeek.id.resp_p),
          mac: move zeek.resp_l2_addr?,
          location: {
            country: move zeek.resp_cc?,
          }
        }
        ocsf.connection_info = {
          community_uid: move zeek.community_id?,
          flag_history: move zeek.history?,
          protocol_name: move zeek.proto,
          protocol_num: $proto_nums[zeek.proto]? else -1
        }
        if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
          ocsf.connection_info.protocol_ver_id = 6
        } else {
          ocsf.connection_info.protocol_ver_id = 4
        }
        drop zeek.id
        if zeek.local_orig? != null and zeek.local_resp? != null {
          if zeek.local_orig and zeek.local_resp {
            ocsf.connection_info.direction = "Lateral"
            ocsf.connection_info.direction_id = 3
          } else if zeek.local_orig {
            ocsf.connection_info.direction = "Outbound"
            ocsf.connection_info.direction_id = 2
          } else if zeek.local_resp {
            ocsf.connection_info.direction = "Inbound"
            ocsf.connection_info.direction_id = 1
          } else {
            ocsf.connection_info.direction = "Unknown"
            ocsf.connection_info.direction_id = 0
          }
          drop zeek.local_orig, zeek.local_resp
        }
        ocsf.status = "Other"
        move ocsf.status_code = zeek.conn_state
        ocsf.status_id = 99
        ocsf.traffic = {
          bytes_in: int(move zeek.resp_bytes?),
          bytes_out: int(move zeek.orig_bytes?),
          bytes_missed: int(move zeek.missed_bytes?),
          packets_in: int(move zeek.resp_pkts?),
          packets_out: int(move zeek.orig_pkts?),
        }
        // Calculate total bytes only if both fields exist
        if zeek.orig_bytes? != null and zeek.resp_bytes? != null {
          ocsf.traffic.bytes = int(zeek.orig_bytes + zeek.resp_bytes)
        }
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.network_activity"
        ocsf::apply
        to_clickhouse table="network_activity", host="clickhouse", primary=class_name, tls=false

    map-dns-to-ocsf:
      name: map dns.log to OCSF DNS Activity
      definition: |
          let $proto_nums = {
                    tcp: 6,
                    udp: 17,
                    icmp: 1,
                    icmpv6: 58,
                    ipv6: 41,
                  }
          let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/dns.log?endpoint_override=http://minio:10000"
                  from $input_path { 
                    read_zeek_json | 
                    timeshift ts, start = now() 
                  }
          this = { zeek: this }
          // === Classification ===
          ocsf.activity_id = 6
          ocsf.activity_name = "Traffic"
          ocsf.category_uid = 4
          ocsf.category_name = "Network Activity"
          ocsf.class_uid = 4003
          ocsf.class_name = "DNS Activity"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
          ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
          // === Occurrence ===
          move ocsf.time = zeek.ts
          ocsf.start_time = ocsf.time
          // === Context ===
          ocsf.metadata = {
            log_name: "dns.log",
            logged_time: move zeek._write_ts?,
            product: {
              name: "Zeek",
              vendor_name: "Zeek",
              cpe_name: "cpe:2.3:a:zeek:zeek",
            },
            uid: move zeek.uid,
            version: "1.4.0",
          }
          drop zeek._path? // implied in metadata.log_name
          // === Primary ===
          ocsf.answers = zip(move zeek.answers?, move zeek.TTLs?).map(x => {
            rdata: string(x.left),
            ttl: int(x.right),
          })
          ocsf.query = {
            class: move zeek.qclass_name,
            hostname: move zeek.query,
            // TODO: go deeper and extract the log semantics.
            //opcode_id: 0,
            type: move zeek.qtype_name,
          }
          ocsf.query_time = ocsf.time
          ocsf.response_time = ocsf.time
          move ocsf.rcode = zeek.rcode_name?
          move ocsf.rcode_id = zeek.rcode?
          ocsf.src_endpoint = {
            ip: zeek.id.orig_h,
            port: int(zeek.id.orig_p),
          }
          ocsf.dst_endpoint = {
            ip: zeek.id.resp_h,
            port: int(zeek.id.resp_p),
          }
          ocsf.connection_info = {
            direction: "Other",
            direction_id: 99,
            protocol_name: move zeek.proto,
            protocol_num: $proto_nums[zeek.proto]? else -1
          }
          if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
            ocsf.connection_info.protocol_ver_id = 6
          } else {
            ocsf.connection_info.protocol_ver_id = 4
          }
          drop zeek.id
          ocsf.status = "Unknown"
          ocsf.status_id = 0
          this = {...ocsf, unmapped: zeek.print_ndjson()}
          @name = "ocsf.dns_activity"
          ocsf::apply
          to_clickhouse table="dns_activity", host="clickhouse", primary=class_name, tls=false

    map-http-to-ocsf:
      name: http.log to OCSF HTTP Activity
      description: Maps Zeek HTTP logs to OCSF HTTP Activity.
      definition: |
        let $methods = {
          CONNECT: 1,
          DELETE: 2,
          GET: 3,
          HEAD: 4,
          OPTIONS: 5,
          POST: 6,
          PUT: 7,
          TRACE: 8,
        }
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/http.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        ocsf.activity_id = $methods[zeek.method]? else 0
        move ocsf.activity_name = zeek.method?
        ocsf.category_uid = 4
        ocsf.category_name = "Network Activity"
        ocsf.class_uid = 4002
        ocsf.class_name = "HTTP Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        move ocsf.time = zeek.ts
        ocsf.start_time = ocsf.time
        // === Context ===
        ocsf.metadata = {
          log_name: "http.log",
          logged_time: move zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          uid: move zeek.uid,
          version: "1.4.0",
        }
        drop zeek._path? // implied in metadata.log_name
        // === Primary ===
        if zeek.has("dest_host") {
          host = zeek.dest_host
        } else {
          host = zeek.host
        }
        ocsf.http_request = {
            http_method: ocsf.activity_name,
            referrer: move zeek.referrer?,
            url: {
              hostname: move host,
              // TODO: Zeek's uri field is actually the path plus all
              // parameters. Take this apart with string or URL functions.
              path: move zeek.uri?,
            },
            user_agent: move zeek.user_agent?,
            version: move zeek.version?,
        }
        ocsf.http_response = {
          code: move zeek.status_code?,
          status: move zeek.status_msg?,
        }
        ocsf.src_endpoint = {
          ip: zeek.id.orig_h,
          port: int(zeek.id.orig_p),
        }
        ocsf.dst_endpoint = {
          ip: zeek.id.resp_h,
          port: int(zeek.id.resp_p),
        }
        ocsf.connection_info = {
          direction: "Other",
          direction_id: 99,
          protocol_name: "tcp",
          protocol_num: 6,
        }
        if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
          ocsf.connection_info.protocol_ver_id = 6
        } else {
          ocsf.connection_info.protocol_ver_id = 4
        }
        drop zeek.id
        // Map status based on transfer completion
        if zeek.missing_bytes? == 0 and zeek.overflow_bytes? == 0 and not zeek.timedout? {
          ocsf.status = "Success"
          ocsf.status_id = 1
        } else {
          ocsf.status = "Failure"
          ocsf.status_id = 2
        }
        // Additional context
        ocsf.duration = int(zeek.duration? * 1000)  // Convert to milliseconds
        ocsf.status_detail = "File transfer via " + string(zeek.source?)
        // File hosting specific fields
        ocsf.share = move zeek.source?
        ocsf.share_type = "Network"
        ocsf.share_type_id = 1  // Network
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.http_activity"
        ocsf::apply
        to_clickhouse table="http_activity", host="clickhouse", primary=activity_name, tls=false

    map-smb-files-to-ocsf:
      name: smb_files.log to OCSF SMB Activity
      description: Maps Zeek SMB files logs to OCSF SMB Activity.
      definition: |
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/smb_files.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        // The Zeek actions don't naturally map to the corresponding OCSF zeek
        // class. Zeek actions have the pattern `SMB::{TYPE}_{ACTION}` where
        // `TYPE` is one of `FILE`, `PIPE`, or `PRINT`.
        if zeek.action.ends_with("_OPEN") {
          ocsf.activity_id = 2
          ocsf.activity_name = "File Open"
        } else {
          ocsf.activity_id = 99
          ocsf.activity_name = "Other"
        }
        ocsf.category_uid = 4
        ocsf.category_name = "Network Activity"
        ocsf.class_uid = 4006
        ocsf.class_name = "SMB Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        ocsf.time = zeek.ts
        drop zeek.ts
        // === Context ===
        ocsf.metadata = {
          log_name: "smb_files.log",
          logged_time: move zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          uid: move zeek.uid,
          version: "1.4.0",
        }
        drop zeek._path? // implied in metadata.log_name
        // === Primary ===
        ocsf.src_endpoint = {
          ip: zeek.id.orig_h,
          port: int(zeek.id.orig_p),
        }
        ocsf.dst_endpoint = {
          ip: zeek.id.resp_h,
          port: int(zeek.id.resp_p),
        }
        ocsf.connection_info = {
          protocol_name: "tcp",
          protocol_num: 6,
        }
        if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
          ocsf.connection_info.protocol_ver_id = 6
        } else {
          ocsf.connection_info.protocol_ver_id = 4
        }
        drop zeek.id
        ocsf.file = {
          name: move zeek.path,
        }
        move ocsf.share = zeek.name
        if zeek.action.starts_with("SMB::FILE") {
          ocsf.share_type_id = 1
          ocsf.share_type = "File"
        } else if zeek.action.starts_with("SMB::PIPE") {
          ocsf.share_type_id = 2
          ocsf.share_type = "Pipe"
        } else if zeek.action.starts_with("SMB::PRINT") {
          ocsf.share_type_id = 3
          ocsf.share_type = "Print"
        } else {
          ocsf.share_type_id = 0
          ocsf.share_type = "Unknown"
        }
        drop zeek.action
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.smb_activity"
        ocsf::apply
        to_clickhouse table="smb_activity", host="clickhouse", primary=activity_name, tls=false

    map-ssl-to-ocsf:
      name: ssl.log to OCSF Network Activity
      description: Maps Zeek SSL logs to OCSF Network Activity.
      definition: |
        // Converted from:
        // https://github.com/zeek/zeek/blob/fdf887ce3bd80e0b466a973d5063c5882303d282/scripts/base/protocols/ssl/consts.zeek#L113
        let $alert_codes = {
          close_notify: 0,
          unexpected_message: 10,
          bad_record_mac: 20,
          decryption_failed: 21,
          record_overflow: 22,
          decompression_failure: 30,
          handshake_failure: 40,
          no_certificate: 41,
          bad_certificate: 42,
          unsupported_certificate: 43,
          certificate_revoked: 44,
          certificate_expired: 45,
          certificate_unknown: 46,
          illegal_parameter: 47,
          unknown_ca: 48,
          access_denied: 49,
          decode_error: 50,
          decrypt_error: 51,
          export_restriction: 60,
          protocol_version: 70,
          insufficient_security: 71,
          internal_error: 80,
          inappropriate_fallback: 86,
          user_canceled: 90,
          no_renegotiation: 100,
          unsupported_extension: 110,
          certificate_unobtainable: 111,
          unrecognized_name: 112,
          bad_certificate_status_response: 113,
          bad_certificate_hash_value: 114,
          unknown_psk_identity: 115,
          certificate_required: 116, // RFC8446
          no_application_protocol: 120,
          ech_required: 121, // draft-ietf-tls-esni-17
        }
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/ssl.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        ocsf.activity_id = 6
        ocsf.activity_name = "Traffic"
        ocsf.category_uid = 4
        ocsf.category_name = "Network Activity"
        ocsf.class_uid = 4001
        ocsf.class_name = "Network Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        ocsf.time = zeek.ts
        drop zeek.ts
        // === Context ===
        ocsf.metadata = {
          log_name: "ssl.log",
          logged_time: move zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          uid: move zeek.uid,
          version: "1.4.0",
        }
        drop zeek._path? // implied in metadata.log_name
        ocsf.tls = {
          certificate: {
            issuer: move zeek.issuer?,
            subject: move zeek.subject?,
          },
          cipher: move zeek.cipher,
          ja3_hash: {
            algorithm: "MD5",
            value: move zeek.ja3?,
          },
          ja3s_hash: {
            algorithm: "MD5",
            value: move zeek.ja3s?,
          },
          sni: move zeek.server_name,
          version: move zeek.version,
        }
        // NB: If we have an alert, `ssl_history` also contains [lL].
        if zeek.last_alert? != null {
          ocsf.tls.alert = $alert_codes[zeek.last_alert]
        }
        // === Primary ===
                 ocsf.src_endpoint = {
           ip: zeek.id.orig_h,
           port: int(zeek.id.orig_p),
         }
         ocsf.dst_endpoint = {
           ip: zeek.id.resp_h,
           port: int(zeek.id.resp_p),
         }
        ocsf.connection_info = {
          protocol_name: "tcp",
          protocol_num: 6,
        }
        if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
          ocsf.connection_info.protocol_ver_id = 6
        } else {
          ocsf.connection_info.protocol_ver_id = 4
        }
        drop zeek.id
        if not zeek.established or zeek.last_alert? != null {
          ocsf.status_id = 2
          ocsf.status = "Failure"
          ocsf.status_detail = zeek.last_alert?
        } else if zeek.validation_status? == "ok" {
          // There could be more `validation_status` values that mean success,
          // but it's difficult to find them. In Zeek, we'd need to grep through
          // all invocations of `x509_result_record` and trace the arguments.
          //
          // Going with just "ok" here is simply going off empirical data.
          ocsf.status_id = 1
          ocsf.status = "Success"
          move ocsf.status_detail = zeek.validation_status?
        } else {
          ocsf.status_id = 0
          ocsf.status = "Unknown"
          move ocsf.status_detail = zeek.validation_status?
        }
        drop zeek.last_alert?
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.network_activity"
        ocsf::apply
        to_clickhouse table="network_activity", host="clickhouse", primary=activity_name, tls=false

    map-x509-to-ocsf:
      name: x509.log to OCSF Network Activity
      description: Maps Zeek x509 logs to OCSF Network Activity.
      definition: |
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/x509.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        ocsf.activity_id = 6
        ocsf.activity_name = "Traffic"
        ocsf.category_uid = 4
        ocsf.category_name = "Network Activity"
        ocsf.class_uid = 4001
        ocsf.class_name = "Network Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        ocsf.time = zeek.ts
        drop zeek.ts
        // === Context ===
        ocsf.metadata = {
          log_name: "x509.log",
          logged_time: zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          version: "1.4.0",
        }
        drop zeek._path? // implied in metadata.log_name
        ocsf.tls = {
          certificate: {
            serial_number: move zeek.certificate.serial,
            created_time: move zeek.certificate.not_valid_before,
            expiration_time: move zeek.certificate.not_valid_after,
            issuer: move zeek.certificate.issuer,
            subject: move zeek.certificate.subject,
            // Convert fingerprint to proper record format - handle case where fingerprint might be null
            fingerprints: [{
              algorithm: "SHA256",
              value: move zeek.fingerprint?
            }].collect(),
            // Convert version to string
            version: string(move zeek.certificate.version),
          },
          // Convert sans to array of records - handle case where san field might not exist
          sans: [{
            name: string(move zeek.san?.dns?)
          }].collect(),
          version: null,
        }
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.network_activity"
        ocsf::apply
        to_clickhouse table="network_activity", host="clickhouse", primary=activity_name, tls=false

    map-kerberos-to-ocsf:
      name: kerberos.log to OCSF Authentication Activity
      description: Maps Zeek Kerberos logs to OCSF Authentication Activity.
      definition: |
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/kerberos.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        // Map request_type to appropriate activity_id
        if zeek.request_type? == "AS" {
          ocsf.activity_id = 3  // Authentication Ticket
          ocsf.activity_name = "Authentication Ticket"
        } else if zeek.request_type? == "TGS" {
          ocsf.activity_id = 4  // Service Ticket Request
          ocsf.activity_name = "Service Ticket Request"
        } else {
          ocsf.activity_id = 0  // Unknown
          ocsf.activity_name = "Unknown"
        }
        ocsf.category_uid = 3
        ocsf.category_name = "Identity & Access Management"
        ocsf.class_uid = 3002
        ocsf.class_name = "Authentication"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        move ocsf.time = zeek.ts
        // === Context ===
        ocsf.metadata = {
          log_name: "kerberos.log",
          logged_time: move zeek._write_ts?,
          product: {
