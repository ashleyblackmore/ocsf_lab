    map-files-to-ocsf:
      name: files.log to OCSF File Activity
      description: Maps Zeek files logs to OCSF File Activity.
      definition: |
        let $input_path = "s3://admin:password@ctf/uisgcon-ctf-1/files.log?endpoint_override=http://minio:10000"

        from $input_path { 
          read_zeek_json | 
          timeshift ts, start = now() 
        }
        drop _path?
        this = { zeek: this }
        // === Classification ===
        // Map file operations based on source and context
        if zeek.source? == "HTTP" {
          ocsf.activity_id = 3  // Download
          ocsf.activity_name = "Download"
        } else if zeek.source? == "SMB" {
          ocsf.activity_id = 1  // Create
          ocsf.activity_name = "Create"
        } else {
          ocsf.activity_id = 0  // Unknown
          ocsf.activity_name = "Unknown"
        }
        ocsf.category_uid = 6
        ocsf.category_name = "Application Activity"
        ocsf.class_uid = 6006
        ocsf.class_name = "File Hosting Activity"
        ocsf.severity_id = 1
        ocsf.severity = "Informational"
        ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
        // === Occurrence ===
        move ocsf.time = zeek.ts
        // === Context ===
        ocsf.metadata = {
          log_name: "files.log",
          logged_time: move zeek._write_ts?,
          product: {
            name: "Zeek",
            vendor_name: "Zeek",
            cpe_name: "cpe:2.3:a:zeek:zeek",
          },
          uid: move zeek.uid,
          version: "1.4.0",
        }
        drop zeek._path? // implied in metadata.log_name
        // === Primary ===
        // Map file with proper metadata
        ocsf.file = {
          name: move zeek.filename?,
          size: int(zeek.total_bytes?),
          type: move zeek.mime_type?,
        }
        // Map file type based on MIME type
        if zeek.mime_type? == "text/plain" {
          ocsf.file.type_id = 1  // Text
        } else if zeek.mime_type? == "application/msword" {
          ocsf.file.type_id = 2  // Document
        } else if zeek.mime_type? == "audio/mpeg" {
          ocsf.file.type_id = 3  // Audio
        } else if zeek.mime_type? == "text/ini" {
          ocsf.file.type_id = 1  // Text
        } else {
          ocsf.file.type_id = 0  // Unknown
        }
        ocsf.src_endpoint = {
          ip: zeek.id.orig_h,
          port: int(zeek.id.orig_p),
        }
        ocsf.dst_endpoint = {
          ip: zeek.id.resp_h,
          port: int(zeek.id.resp_p),
        }
        ocsf.connection_info = {
          protocol_name: "tcp",
          protocol_num: 6,
        }
        if zeek.id.orig_h.is_v6() or zeek.id.resp_h.is_v6() {
          ocsf.connection_info.protocol_ver_id = 6
        } else {
          ocsf.connection_info.protocol_ver_id = 4
        }
        drop zeek.id
        // Map status based on transfer completion
        if zeek.missing_bytes? == 0 and zeek.overflow_bytes? == 0 and not zeek.timedout? {
          ocsf.status = "Success"
          ocsf.status_id = 1
        } else {
          ocsf.status = "Failure"
          ocsf.status_id = 2
        }
        // Additional context
        ocsf.duration = int(zeek.duration? * 1000)  // Convert to milliseconds
        ocsf.status_detail = "File transfer via " + string(zeek.source?)
        // File hosting specific fields
        ocsf.share = move zeek.source?
        ocsf.share_type = "Network"
        ocsf.share_type_id = 1  // Network
        this = {...ocsf, unmapped: zeek.print_ndjson()}
        @name = "ocsf.file_hosting_activity"
        ocsf::apply
        to_clickhouse table="file_hosting_activity", host="clickhouse", primary=activity_name, tls=false
  restart-on-error: 1 minute