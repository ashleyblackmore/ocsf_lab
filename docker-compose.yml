services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ocsf_clickhouse
    ports:
      - "8123:8123"  # HTTP port
      - "9000:9000"  # Native port
    environment:
      - CLICKHOUSE_DB=ocsf_data
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - ocsf_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: ocsf_ch_ui
    ports:
      - "5521:5521"
    environment:
      - VITE_CLICKHOUSE_URL=http://localhost:8123
      - VITE_CLICKHOUSE_USER=default
      - VITE_CLICKHOUSE_PASS=
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - ocsf_network

  data-loader:
    build: .
    container_name: ocsf_data_loader
    volumes:
      - ./OCSF_data_cleaned:/data/ocsf
      - ./scripts:/scripts
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DB=ocsf_data
    depends_on:
      - clickhouse
    networks:
      - ocsf_network
    command: ["python3", "/scripts/load_data.py"]

volumes:
  clickhouse_data:

networks:
  ocsf_network:
    driver: bridge 