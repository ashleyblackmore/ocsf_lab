services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ocsf_clickhouse
    ports:
      - "8123:8123"  # HTTP port
      - "9000:9000"  # Native port
    environment:
      - CLICKHOUSE_DB=ocsf_data
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - ocsf_network

  data-loader:
    build: .
    container_name: ocsf_data_loader
    volumes:
      - ./OCSF_data_cleaned:/data/ocsf
      - ./scripts:/scripts
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DB=ocsf_data
    depends_on:
      - clickhouse
    networks:
      - ocsf_network
    command: ["python3", "/scripts/load_data.py"]

volumes:
  clickhouse_data:

networks:
  ocsf_network:
    driver: bridge 